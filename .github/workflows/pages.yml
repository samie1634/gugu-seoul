name: Deploy Gugu Seoul to GitHub Pages

on:
  push:
    branches: [main, release/build6-pages-review]
    paths: ['.github/workflows/pages.yml', 'release/build6-manifest.json']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified output from main to the existing Pages environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'samie1634/gugu-seoul' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/build6-pages-review') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: gugu-pages-draft-intake
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved version
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public source files without binary exceptions
        run: pnpm audit:public
      - name: Retrieve the exact authorized release asset by ID
        env:
          ASSET_ID: ${{ secrets.GUGU_DRAFT_ASSET_ID }}
          DRAFT_TOKEN: ${{ secrets.GUGU_DRAFT_READ_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          EXPECTED = {
              "name": "GuguSeoul-Build6-Pages-Runtime-Only.zip",
              "bytes": 38316416,
              "sha256": "31d6933950dd4b01e9cc9e7b49846a89d9361078b0a94a02300e5355b4a50849",
          }
          RELEASE_STORAGE = "release-assets.githubusercontent.com"
          GITHUB_API = "https://api.github.com/repos/samie1634/gugu-seoul/releases/assets/"

          class IntakeError(Exception):
              """Messages are deliberately safe to print; no request URL, token, or server body."""

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          def receive(open_request, asset_id, token, expected):
              if not re.fullmatch(r"[1-9][0-9]{0,18}", asset_id):
                  raise IntakeError("The protected release asset ID is missing or malformed.")
              if not token or any(c.isspace() for c in token):
                  raise IntakeError("The protected draft-read credential is missing or malformed.")
              asset = Request(GITHUB_API + asset_id, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/octet-stream",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  response = open_request(asset, timeout=90)
              except HTTPError as first:
                  if first.code != 302:
                      raise IntakeError(f"GitHub Get release asset returned HTTP {first.code}; stopping.") from None
                  target = first.headers.get("Location", "")
                  first.close()
                  dest = urlsplit(target)
                  if not target or any(ord(c) <= 32 or ord(c) == 127 for c in target) or (
                      dest.scheme != "https" or dest.netloc != RELEASE_STORAGE or not dest.path or dest.fragment
                  ):
                      raise IntakeError("GitHub returned an unapproved release asset redirect; stopping.") from None
                  # This new request deliberately lacks Authorization, cookies and other API credentials.
                  try:
                      response = open_request(Request(target, headers={"Accept": "application/octet-stream"}), timeout=90)
                  except HTTPError as second:
                      raise IntakeError(f"GitHub release asset storage returned HTTP {second.code}; stopping.") from None
              with response:
                  if response.status != 200:
                      raise IntakeError(f"GitHub release asset returned HTTP {response.status}; stopping.")
                  if response.headers.get("Content-Type", "").split(";")[0].strip().lower() == "application/json":
                      raise IntakeError("Expected binary ZIP; GitHub returned JSON metadata instead.")
                  raw = response.read(expected["bytes"] + 1)
              if len(raw) != expected["bytes"] or hashlib.sha256(raw).hexdigest() != expected["sha256"]:
                  raise IntakeError("Release asset size or SHA-256 does not match the approved runtime ZIP.")
              return raw

          def entry():
              try:
                  manifest = json.loads(Path("release/build6-manifest.json").read_text())
                  if manifest.get("artifact") != EXPECTED:
                      raise IntakeError("Runtime release manifest changed; stopping.")
                  connection = build_opener(NoRedirect())
                  raw = receive(connection.open, os.environ.get("ASSET_ID", ""), os.environ.get("DRAFT_TOKEN", ""), EXPECTED)
                  with (Path(os.environ["RUNNER_TEMP"]) / "gugu-runtime.zip").open("xb") as file:
                      file.write(raw)
                  print("Exact approved runtime ZIP size and SHA-256 verified.")
              except IntakeError as exc:
                  raise SystemExit(str(exc)) from None
              except Exception:
                  # Do not print urllib exceptions or tracebacks: they can contain signed storage URLs.
                  raise SystemExit("The protected GitHub asset intake could not complete safely.") from None

          if __name__ == "__main__":
              entry()
          PYCODE
      - name: Verify archive, rights scope and binary paths and hydrate only runtime inputs
        run: python3 tools/verify-pages-release.py hydrate "$RUNNER_TEMP/gugu-runtime.zip"
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify the fresh build byte for byte against the accepted game
        run: python3 tools/verify-pages-release.py dist dist
      - name: Require a passing non-deploying review of this exact commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PREFLIGHT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl -fsS --proto '=https' --max-time 40 -H "Authorization: Bearer $PREFLIGHT_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/samie1634/gugu-seoul/actions/runs?branch=release%2Fbuild6-pages-review&event=push&head_sha=$GITHUB_SHA" |
              jq -e --arg sha "$GITHUB_SHA" 'any(.workflow_runs[]?;
                .head_sha == $sha and .head_branch == "release/build6-pages-review" and
                .path == ".github/workflows/pages.yml" and .event == "push" and
                .status == "completed" and .conclusion == "success")' > /dev/null
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository == 'samie1634/gugu-seoul' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
