name: Deploy Gugu Seoul to GitHub Pages

on:
  push:
    branches: [main, release/build6-pages-review]
    paths: ['.github/workflows/pages.yml', 'release/build6-manifest.json']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified output from main to the existing Pages environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'samie1634/gugu-seoul' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/build6-pages-review') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: gugu-pages-draft-intake
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved version
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public source files without binary exceptions
        run: pnpm audit:public
      - name: Verify the operator-approved private intake repository
        env:
          INTAKE_PHASE: verify-private
          INTAKE_COMMIT: ${{ secrets.GUGU_PRIVATE_INTAKE_COMMIT }}
          INTAKE_TOKEN: ${{ secrets.GUGU_PRIVATE_INTAKE_READ_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          REPO = "samie1634/gugu-pages-intake"
          BASENAME = "GuguSeoul-Build6-Pages-Runtime-Only.zip"
          PARTS = (
              (BASENAME + ".part1", 19200000, "643e8962089dccfc06d2317fb06a6aaaa318625d8b58e12ab76604b170f2ad7b", "97315559953b69c544ac91afb2bfaf2943b40809"),
              (BASENAME + ".part2", 19116416, "7d48224327a33e92bc96df42c4f93817a3d8222f58f386aedea5569be1add949", "0d9813c221a18fb2827b50803a366b602d8416ca"),
          )
          EXPECTED = {"name":BASENAME,"bytes":38316416,"sha256":"31d6933950dd4b01e9cc9e7b49846a89d9361078b0a94a02300e5355b4a50849"}

          class IntakeError(Exception):
              pass

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          def check(condition, message):
              if not condition: raise IntakeError(message)

          def require_pin(commit):
              check(re.fullmatch("[a-f0-9]{40}", commit) and commit != "0"*40, "Protected private intake commit is missing or malformed.")

          def verify_private(open_request, commit, token):
              require_pin(commit)
              check(bool(token) and not any(c.isspace() for c in token), "Protected private intake token is missing or malformed.")
              req = Request("https://api.github.com/repos/"+REPO, headers={"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"})
              try:
                  with open_request(req, timeout=45) as response:
                      check(response.status == 200, "GitHub did not return private intake repository metadata.")
                      meta = json.loads(response.read(128*1024))
              except HTTPError as exc:
                  raise IntakeError(f"GitHub private intake metadata was refused (HTTP {exc.code}).") from None
              check(meta.get("full_name")==REPO and meta.get("private") is True and meta.get("visibility")=="private",
                    "Intake repository is missing, has the wrong owner, or is not private.")

          def read_git(repo, *args):
              return subprocess.run(["git","-C",str(repo),*args],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True).stdout

          def materialize(repo, commit, target):
              require_pin(commit)
              check(read_git(repo,"rev-parse","--verify","HEAD").decode("ascii").strip()==commit,"Checkout does not match the pinned private commit.")
              expected_tree = {f"100644 blob {blob}\t{name}" for name, _, _, blob in PARTS}
              actual_tree = read_git(repo,"ls-tree","-r","-z","HEAD").decode("ascii").rstrip("\0").split("\0")
              check(len(actual_tree)==2 and set(actual_tree)==expected_tree,"Intake commit must contain only the two reviewed regular-file blobs.")
              data=[]
              for name,size,digest,blob in PARTS:
                  part=repo/name
                  check(not part.is_symlink() and part.is_file() and part.stat().st_size==size,"Intake file size/type mismatch.")
                  raw=part.read_bytes()
                  actual_blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
                  check(hashlib.sha256(raw).hexdigest()==digest and actual_blob==blob,"Unsafe or changed intake slice; refusing.")
                  data.append(raw)
              joined=b"".join(data)
              check(len(joined)==EXPECTED["bytes"] and hashlib.sha256(joined).hexdigest()==EXPECTED["sha256"],"Joining slices did not reproduce the approved ZIP.")
              with target.open("xb") as file:file.write(joined)

          def entry():
              try:
                  pinned=os.environ.get("INTAKE_COMMIT","")
                  if os.environ.get("INTAKE_PHASE")=="verify-private":
                      verify_private(build_opener(NoRedirect()).open,pinned,os.environ.get("INTAKE_TOKEN",""))
                      print("Verified the approved intake repository is private.")
                  else:
                      check(json.loads(Path("release/build6-manifest.json").read_text()).get("artifact")==EXPECTED,"Reviewed game manifest changed.")
                      materialize(Path(".cache/private-package-intake"),pinned,Path(os.environ["RUNNER_TEMP"])/"gugu-runtime.zip")
                      print("Verified pinned Git blobs and exact original runtime ZIP.")
              except IntakeError as exc:
                  raise SystemExit(str(exc)) from None
              except Exception:
                  raise SystemExit("Protected private GitHub intake could not complete safely.") from None

          if __name__ == "__main__": entry()
          PYCODE
      - name: Check out the pinned intake commit with only repository-specific read access
        uses: actions/checkout@v4
        with:
          repository: samie1634/gugu-pages-intake
          ref: ${{ secrets.GUGU_PRIVATE_INTAKE_COMMIT }}
          token: ${{ secrets.GUGU_PRIVATE_INTAKE_READ_TOKEN }}
          path: .cache/private-package-intake
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify the two slices and reconstruct the exact approved ZIP
        env:
          INTAKE_PHASE: assemble
          INTAKE_COMMIT: ${{ secrets.GUGU_PRIVATE_INTAKE_COMMIT }}
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          REPO = "samie1634/gugu-pages-intake"
          BASENAME = "GuguSeoul-Build6-Pages-Runtime-Only.zip"
          PARTS = (
              (BASENAME + ".part1", 19200000, "643e8962089dccfc06d2317fb06a6aaaa318625d8b58e12ab76604b170f2ad7b", "97315559953b69c544ac91afb2bfaf2943b40809"),
              (BASENAME + ".part2", 19116416, "7d48224327a33e92bc96df42c4f93817a3d8222f58f386aedea5569be1add949", "0d9813c221a18fb2827b50803a366b602d8416ca"),
          )
          EXPECTED = {"name":BASENAME,"bytes":38316416,"sha256":"31d6933950dd4b01e9cc9e7b49846a89d9361078b0a94a02300e5355b4a50849"}

          class IntakeError(Exception):
              pass

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          def check(condition, message):
              if not condition: raise IntakeError(message)

          def require_pin(commit):
              check(re.fullmatch("[a-f0-9]{40}", commit) and commit != "0"*40, "Protected private intake commit is missing or malformed.")

          def verify_private(open_request, commit, token):
              require_pin(commit)
              check(bool(token) and not any(c.isspace() for c in token), "Protected private intake token is missing or malformed.")
              req = Request("https://api.github.com/repos/"+REPO, headers={"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"})
              try:
                  with open_request(req, timeout=45) as response:
                      check(response.status == 200, "GitHub did not return private intake repository metadata.")
                      meta = json.loads(response.read(128*1024))
              except HTTPError as exc:
                  raise IntakeError(f"GitHub private intake metadata was refused (HTTP {exc.code}).") from None
              check(meta.get("full_name")==REPO and meta.get("private") is True and meta.get("visibility")=="private",
                    "Intake repository is missing, has the wrong owner, or is not private.")

          def read_git(repo, *args):
              return subprocess.run(["git","-C",str(repo),*args],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True).stdout

          def materialize(repo, commit, target):
              require_pin(commit)
              check(read_git(repo,"rev-parse","--verify","HEAD").decode("ascii").strip()==commit,"Checkout does not match the pinned private commit.")
              expected_tree = {f"100644 blob {blob}\t{name}" for name, _, _, blob in PARTS}
              actual_tree = read_git(repo,"ls-tree","-r","-z","HEAD").decode("ascii").rstrip("\0").split("\0")
              check(len(actual_tree)==2 and set(actual_tree)==expected_tree,"Intake commit must contain only the two reviewed regular-file blobs.")
              data=[]
              for name,size,digest,blob in PARTS:
                  part=repo/name
                  check(not part.is_symlink() and part.is_file() and part.stat().st_size==size,"Intake file size/type mismatch.")
                  raw=part.read_bytes()
                  actual_blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
                  check(hashlib.sha256(raw).hexdigest()==digest and actual_blob==blob,"Unsafe or changed intake slice; refusing.")
                  data.append(raw)
              joined=b"".join(data)
              check(len(joined)==EXPECTED["bytes"] and hashlib.sha256(joined).hexdigest()==EXPECTED["sha256"],"Joining slices did not reproduce the approved ZIP.")
              with target.open("xb") as file:file.write(joined)

          def entry():
              try:
                  pinned=os.environ.get("INTAKE_COMMIT","")
                  if os.environ.get("INTAKE_PHASE")=="verify-private":
                      verify_private(build_opener(NoRedirect()).open,pinned,os.environ.get("INTAKE_TOKEN",""))
                      print("Verified the approved intake repository is private.")
                  else:
                      check(json.loads(Path("release/build6-manifest.json").read_text()).get("artifact")==EXPECTED,"Reviewed game manifest changed.")
                      materialize(Path(".cache/private-package-intake"),pinned,Path(os.environ["RUNNER_TEMP"])/"gugu-runtime.zip")
                      print("Verified pinned Git blobs and exact original runtime ZIP.")
              except IntakeError as exc:
                  raise SystemExit(str(exc)) from None
              except Exception:
                  raise SystemExit("Protected private GitHub intake could not complete safely.") from None

          if __name__ == "__main__": entry()
          PYCODE
      - name: Verify archive, rights scope and binary paths and hydrate only runtime inputs
        run: python3 tools/verify-pages-release.py hydrate "$RUNNER_TEMP/gugu-runtime.zip"
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify the fresh build byte for byte against the accepted game
        run: python3 tools/verify-pages-release.py dist dist
      - name: Require a passing non-deploying review of this exact commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PREFLIGHT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl -fsS --proto '=https' --max-time 40 -H "Authorization: Bearer $PREFLIGHT_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/samie1634/gugu-seoul/actions/runs?branch=release%2Fbuild6-pages-review&event=push&head_sha=$GITHUB_SHA" |
              jq -e --arg sha "$GITHUB_SHA" 'any(.workflow_runs[]?;
                .head_sha == $sha and .head_branch == "release/build6-pages-review" and
                .path == ".github/workflows/pages.yml" and .event == "push" and
                .status == "completed" and .conclusion == "success")' > /dev/null
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository == 'samie1634/gugu-seoul' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
