name: Deploy Gugu Seoul to GitHub Pages

on:
  push:
    branches: [main, release/build6-pages-review]
    paths: ['.github/workflows/pages.yml', 'release/build6-manifest.json']
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Numeric ID of the same-repository private draft holding the verified runtime ZIP
        required: true
        type: string
      publish:
        description: Publish verified output from main to the existing Pages environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'samie1634/gugu-seoul' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/build6-pages-review') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: gugu-pages-draft-intake
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved version
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public source files without binary exceptions
        run: pnpm audit:public
      - name: Retrieve the pinned pre-reviewed game ZIP from the private draft only
        env:
          RELEASE_ID: ${{ inputs.draft_release_id }}
          DRAFT_TOKEN: ${{ secrets.GUGU_DRAFT_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DRAFT_TOKEN:-}" ]] || { echo "::error::The protected draft-intake secret is not configured."; exit 1; }
          endpoint="https://api.github.com/repos/samie1634/gugu-seoul/releases"
          name=$(jq -er '.artifact.name' release/build6-manifest.json)
          hash=$(jq -er '.artifact.sha256' release/build6-manifest.json)
          bytes=$(jq -er '.artifact.bytes' release/build6-manifest.json)
          get=(curl -fsS --proto '=https' --max-time 90 -H "Authorization: Bearer $DRAFT_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RELEASE_ID=$("${get[@]}" -H 'Accept: application/vnd.github+json' "$endpoint?per_page=100" |
              jq -er --arg name "$name" --arg hash "sha256:$hash" --argjson bytes "$bytes" '
                [.[] | select(.draft == true and .published_at == null and any(.assets[]?;
                  .name == $name and .state == "uploaded" and .size == $bytes and .digest == $hash))] |
                select(length == 1) | .[0].id') || {
                  echo "::error::The protected draft credential cannot see exactly one matching private draft."
                  exit 1
                }
          fi
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          asset=$("${get[@]}" -H 'Accept: application/vnd.github+json' "$endpoint/$RELEASE_ID" |
            jq -er --arg name "$name" --arg hash "sha256:$hash" --argjson bytes "$bytes" '
              select(.draft == true and .published_at == null) |
              [.assets[] | select(.name == $name and .state == "uploaded" and .size == $bytes and .digest == $hash)] |
              select(length == 1) | .[0].id')
          [[ "$asset" =~ ^[1-9][0-9]{0,18}$ ]]
          "${get[@]}" --location --max-filesize "$bytes" --proto-redir '=https' -H 'Accept: application/octet-stream' \
            "$endpoint/assets/$asset" --output "$RUNNER_TEMP/gugu-runtime.zip"
      - name: Verify archive, rights scope and binary paths and hydrate only runtime inputs
        run: python3 tools/verify-pages-release.py hydrate "$RUNNER_TEMP/gugu-runtime.zip"
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify the fresh build byte for byte against the accepted game
        run: python3 tools/verify-pages-release.py dist dist
      - name: Require a passing non-deploying review of this exact commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PREFLIGHT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl -fsS --proto '=https' --max-time 40 -H "Authorization: Bearer $PREFLIGHT_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/samie1634/gugu-seoul/actions/runs?branch=release%2Fbuild6-pages-review&event=push&head_sha=$GITHUB_SHA" |
              jq -e --arg sha "$GITHUB_SHA" 'any(.workflow_runs[]?;
                .head_sha == $sha and .head_branch == "release/build6-pages-review" and
                .path == ".github/workflows/pages.yml" and .event == "push" and
                .status == "completed" and .conclusion == "success")' > /dev/null
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.repository == 'samie1634/gugu-seoul' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
